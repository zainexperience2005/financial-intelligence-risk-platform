services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-financial_app}:${POSTGRES_PASSWORD:-financial_password}@postgres:5432/${POSTGRES_DB:-financial_platform}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-financial_app}:${POSTGRES_PASSWORD:-financial_password}@postgres:5432/${POSTGRES_DB:-financial_platform}
      READONLY_DATABASE_URL: postgresql+psycopg://financial_reader:reader_dev_password@postgres:5432/${POSTGRES_DB:-financial_platform}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_platform}
      POSTGRES_USER: ${POSTGRES_USER:-financial_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-financial_app} -d ${POSTGRES_DB:-financial_platform}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:
  postgres_data:
  qdrant_data:
  redis_data:
