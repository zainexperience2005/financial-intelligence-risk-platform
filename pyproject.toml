[project]
name = "financial-intelligence-risk-platform"
version = "0.1.0"
description = "Agentic AI platform for financial intelligence and risk operations."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
extraPaths = ["src"]