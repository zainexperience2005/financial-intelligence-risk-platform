[project]
name = "financial-intelligence-risk-platform"
version = "0.1.0"
description = "Agentic AI platform for financial intelligence and risk operations."
requires-python = ">=3.12"
dependencies = [
    "fastapi", "uvicorn", "gunicorn", "pydantic>=2,<3", "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "sqlglot", "pandas",
    "langchain-core", "langchain-openai", "langgraph", "langchain-qdrant",
    "qdrant-client", "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "integration: requires infrastructure",
    "llm: requires an external LLM provider",
    "qdrant: requires Qdrant",
    "mcp: MCP integration test",
    "e2e: end-to-end system test",
    "postgres: requires an explicitly configured PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pyright]
extraPaths = ["src"]
[tool.ruff.lint.per-file-ignores]
# Preserve the existing runtime generic interface during this cleanup.
"src/kit/tools/base.py" = ["UP046"]
