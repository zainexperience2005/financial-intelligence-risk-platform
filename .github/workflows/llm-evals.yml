name: LLM Evaluations & Observability

on:
  workflow_dispatch:
    inputs:
      experiment_name:
        description: "Name for the LangSmith experiment"
        required: false
        default: "financial-eval-manual"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Golden Dataset Schema
        run: |
          python -m pytest tests/unit/app/evaluation/test_golden_dataset.py -v

      - name: Run Component Risk Evaluation
        run: |
          PYTHONPATH=src python evals/experiments/run_risk_eval.py

      - name: Sync Dataset to LangSmith
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT || 'financial-intelligence-platform' }}
        run: |
          PYTHONPATH=src python scripts/sync_langsmith_dataset.py
