name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        run: |
          ruff check src tests

      - name: Ruff format check
        run: |
          ruff format --check src tests

      - name: Run unit tests
        run: |
          pytest tests/unit -v

      - name: Security regression tests
        run: |
          pytest tests/security -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs:
      - quality

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: financial_test
          POSTGRES_USER: financial_app
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U financial_app -d financial_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: >-
        postgresql+psycopg://financial_app:test_password@localhost:5432/financial_test
      READONLY_DATABASE_URL: >-
        postgresql+psycopg://financial_app:test_password@localhost:5432/financial_test
      CHECKPOINT_DATABASE_URL: >-
        postgresql://financial_app:test_password@localhost:5432/financial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create database tables
        run: |
          PYTHONPATH=src python scripts/create_tables.py

      - name: Run database integration tests
        run: |
          pytest tests/integration/database -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: financial-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
